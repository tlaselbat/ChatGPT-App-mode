<!-- Synthetic conversation header with every regular header action present.
     The spacer nodes model the hidden sidebar-width offsets the site leaves
     in the header when the sidebar expands; the layout pass must collapse
     them so the title sits between the leading controls and the actions. -->
<div class="fixture-sidebar-spacer" aria-hidden="true" style="width:260px;flex:0 0 auto"></div>
<div class="fixture-leading" style="display:flex;gap:6px">
  <button aria-label="Sidebar"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM10 4v16" fill="none" stroke="currentColor"/></svg></button>
  <button aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M5 19h14M8 16l1-5L18 2l4 4-9 9z" fill="none" stroke="currentColor"/></svg></button>
</div>
<div class="fixture-title" style="display:flex;flex:1;align-items:center;min-width:0">
  <div class="fixture-title-offset" aria-hidden="true" style="width:220px;flex:0 0 auto"></div>
  <span class="title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Synthetic header</span>
</div>
<div style="width:0;margin-left:240px"></div>
<div class="fixture-actions" style="display:flex;gap:6px">
  <button aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  <button aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M5 13v7h14v-7" fill="none" stroke="currentColor"/></svg><span>Share</span></button>
</div>
