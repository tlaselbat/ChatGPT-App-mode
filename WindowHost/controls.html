<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="controls.css">
  <title>Window controls</title>
</head>
<body>
  <div class="titlebar">
    <div class="brand" aria-label="ChatGPT App Mode">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-name">ChatGPT</span>
    </div>
    <!-- The app-owned drag region fills every pixel not taken by a button. -->
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="controls" role="group" aria-label="Window controls">
      <button type="button" data-action="pin" aria-label="Always on top" aria-pressed="false" title="Always on top">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.0589 2.44535C9.34701 1.73087 8.14697 1.90854 7.67261 2.79864L5.6526 6.58902L2.8419 7.52592C2.6775 7.58072 2.5532 7.71673 2.51339 7.88539C2.47357 8.05404 2.52392 8.23128 2.64646 8.35382L4.79287 10.5002L2.14637 13.1467L2 14.0003L2.85348 13.8538L5.49998 11.2073L7.64646 13.3538C7.76899 13.4764 7.94623 13.5267 8.11489 13.4869C8.28354 13.4471 8.41955 13.3228 8.47435 13.1584L9.41143 10.3472L13.1897 8.32448C14.0759 7.85006 14.2538 6.65535 13.5443 5.9433L10.0589 2.44535Z" fill="currentColor"/></svg>
      </button>
      <button type="button" data-action="minimize" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg>
      </button>
      <button type="button" data-action="maximize" aria-label="Maximize" title="Maximize">
        <svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9"/></svg>
        <svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4V2.5h8v8H12M2.5 5.5h8v8h-8z"/></svg>
      </button>
      <button type="button" data-action="close" aria-label="Close" title="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </div>
  <script src="controls.js"></script>
</body>
</html>
